<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf in Fife">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Golf in Fife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0D1B33; --navy:#16294A; --navy2:#22385F;
  --ivory:#F7F4EC; --card:#FFFFFF; --hair:#E4DCCB; --hair2:#EFE9DC;
  --gold:#B08D4C; --goldlt:#D8C18F; --golddk:#8A6A2E;
  --green:#2F4B37; --claret:#7A1F2B;
  --ink:#1A1C22; --muted:#6D6A63; --faint:#9C978C;
  --serif:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --sans:'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--midnight);color:var(--ivory);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--gold)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;background:#F8F6EF;box-shadow:0 0 0 1.5px var(--gold);flex:none}
.brand h1{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;margin:0;letter-spacing:.3px}
.brand .sub{font-size:12px;color:#B9C1D1;margin-top:3px;letter-spacing:.3px}
.pill{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;border:1px solid rgba(216,193,143,.45);background:none;border-radius:999px;padding:5px 10px;color:var(--ivory)}
.pill i{width:7px;height:7px;border-radius:50%;background:#8FBF7F;display:block}
.pill.live i{animation:pulse 1.8s ease-in-out infinite}
.pill.wait i{background:var(--goldlt)} .pill.off i{background:#D9776B}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pill.live i{animation:none}}

main{max-width:560px;margin:0 auto;padding:14px 14px 28px}
h2{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.1;margin:22px 0 10px;color:var(--midnight)}
h2:first-child{margin-top:4px}
h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:14px 0 6px;color:var(--midnight)}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.lead{font-family:var(--serif);font-size:19px;line-height:1.45;color:#3A3C44}

/* Segmented control */
.seg{display:flex;background:#EDE7DA;border-radius:12px;padding:3px;gap:2px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:500;color:#5B5850;line-height:1.15;min-height:40px}
.seg button small{display:block;font-size:11px;font-weight:400;color:var(--faint);margin-top:1px}
.seg button.on{background:var(--card);color:var(--midnight);box-shadow:0 1px 3px rgba(13,27,51,.12)}
.seg button.on small{color:var(--golddk)}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;background:var(--ivory);padding-top:4px;margin-top:-4px}

.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px;margin:0 0 12px}
.note{border-left:2px solid var(--gold);background:#F4EEDF;padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:10px 0}
.note.warn{border-left-color:var(--claret);background:#F5E9E7}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:-4px 2px 10px}

/* Honours board (total ranking) */
.honours{background:var(--midnight);color:var(--ivory);border-radius:var(--r);padding:18px 12px 10px;
  box-shadow:inset 0 0 0 1px var(--gold), inset 0 0 0 5px var(--midnight), inset 0 0 0 6px rgba(176,141,76,.55)}
.honours .ttl{font-family:var(--serif);font-style:italic;font-weight:500;font-size:25px;color:var(--goldlt);text-align:center;margin:0}
.honours .st{text-align:center;font-size:12px;color:#AEB7C8;margin:2px 0 12px}
.hrow{display:grid;grid-template-columns:30px 1fr 34px 34px 34px 48px;align-items:center;gap:4px;padding:11px 6px;border-top:1px solid rgba(216,193,143,.18)}
.hrow.head{border-top:0;padding:0 6px 6px;font-size:11px;color:#9FA9BC}
.hrow.head span{text-align:center}
.hrow .pos{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--goldlt);text-align:center}
.hrow .nm{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .nm small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:#9FA9BC;margin-top:2px}
.hrow .rd{text-align:center;font-size:15px;color:#D5DBE6}
.hrow .rd.none{color:#56647C}
.hrow .rd sup{font-size:9px;color:var(--goldlt)}
.hrow .tot{text-align:right;font-size:22px;font-weight:600;color:var(--goldlt)}
.hrow.first .nm{color:#fff}
button.hrow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left}
.honours .empty{text-align:center;color:#AEB7C8;padding:18px 8px;font-size:15px}

/* Live course leaderboard */
.lb{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:34px 1fr 44px 50px;align-items:center;gap:6px;padding:12px 12px;border-top:1px solid var(--hair2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.lrow:first-child{border-top:0}
.lrow.head{padding:8px 12px;font-size:11px;color:var(--muted);background:#FBF9F4}
.lrow.head span:nth-child(n+3){text-align:center}
.lrow .pos{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--golddk);text-align:center}
.lrow .nm{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--midnight);line-height:1.1}
.lrow .nm small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.thru{justify-self:center;min-width:34px;text-align:center;font-size:13px;font-weight:500;border:1px solid var(--hair);border-radius:999px;padding:2px 6px;color:var(--muted)}
.thru.f{background:var(--midnight);border-color:var(--midnight);color:var(--goldlt)}
.thru.on{border-color:var(--gold);color:var(--golddk)}
.lrow .pts{text-align:right;font-size:24px;font-weight:600;color:var(--midnight)}
.exp{padding:4px 12px 14px;background:#FBF9F4;border-top:1px solid var(--hair2)}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;text-align:center;margin-top:8px}
.holes .hn{font-size:10px;color:var(--faint)}
.holes .hp{font-size:10px;color:var(--green);font-weight:600;min-height:14px}

/* Score marks (Gamebook style) */
.mk{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;font-size:14px;font-weight:500;color:var(--ink)}
.mk.b{border:1.5px solid var(--gold);border-radius:50%;color:var(--golddk);font-weight:600}
.mk.e{background:var(--gold);border-radius:50%;color:#fff;font-weight:600}
.mk.o{border:1px solid #8A93A5;border-radius:3px}
.mk.d{background:var(--navy);border-radius:3px;color:#fff}
.mk.x{color:var(--faint)}
.mk.n{color:#C9C3B6}

/* Matrix */
.mx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--hair);border-radius:var(--r);background:var(--card)}
.mx table{border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{padding:6px 2px;text-align:center;border-bottom:1px solid var(--hair2);min-width:30px}
.mx th{font-weight:500;color:var(--muted);background:#FBF9F4;font-size:11px}
.mx .sticky{position:sticky;left:0;background:var(--card);text-align:left;padding-left:10px;min-width:92px;font-family:var(--serif);font-weight:600;font-size:16px;color:var(--midnight);border-right:1px solid var(--hair2);z-index:1}
.mx th.sticky{background:#FBF9F4;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted)}
.mx .tot{font-weight:600;color:var(--midnight);background:#F6F1E6}
.mx .mk{width:23px;height:23px;font-size:12px}

/* Score entry */
.hole{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.holehead{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--midnight);color:var(--ivory)}
.holenum{font-family:var(--serif);font-size:52px;font-weight:600;line-height:.85;color:var(--goldlt);min-width:52px;text-align:center}
.holeinfo .nm{font-family:var(--serif);font-style:italic;font-size:19px;color:#fff}
.holeinfo .facts{display:flex;gap:14px;font-size:13px;color:#AEB7C8;margin-top:2px}
.holeinfo .facts b{color:#fff;font-weight:500}
.prow{display:grid;grid-template-columns:1fr 52px 58px 52px 40px;align-items:center;gap:6px;padding:12px 14px;border-top:1px solid var(--hair2)}
.prow:first-of-type{border-top:0}
.pname{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.05;color:var(--midnight);min-width:0}
.pname small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.pname .st{color:var(--golddk);font-weight:500}
.pm{height:52px;border-radius:12px;border:1px solid var(--hair);background:#FBF9F4;font-size:26px;font-weight:400;color:var(--midnight);user-select:none}
.pm:active{background:#EDE7DA;transform:scale(.97)}
.sc{height:58px;border-radius:12px;border:1.5px solid var(--midnight);background:#fff;font-size:28px;font-weight:600;color:var(--midnight)}
.sc.empty{border-style:dashed;border-color:#B9B3A6;color:#B9B3A6;font-weight:400}
.sc.pu{font-size:13px;font-weight:500}
.sc.b{border-color:var(--gold);color:var(--golddk);box-shadow:0 0 0 3px rgba(176,141,76,.18)}
.ptsb{text-align:center;font-weight:600;font-size:20px;color:var(--midnight);line-height:1}
.ptsb small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px}
.ptsb.p0{color:var(--claret)} .ptsb.p3{color:var(--green)} .ptsb.p4{color:var(--golddk)}
.pu-link{grid-column:1/2;justify-self:start;margin-top:-6px;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:4px 0}
.holenav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:0 14px 14px}
.btn{border:1px solid var(--midnight);background:var(--midnight);color:#fff;border-radius:12px;padding:13px 14px;font-weight:500;font-size:16px;min-height:48px}
.btn:disabled{opacity:.35}
.btn.alt{background:#fff;color:var(--midnight);border-color:var(--hair)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.red{background:#fff;border-color:#D8B7B7;color:var(--claret)}
.btn.sm{padding:9px 14px;font-size:14px;min-height:40px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;padding:0 14px 14px}
.strip button{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:0;height:34px;font-size:13px;font-weight:500;color:var(--muted)}
.strip button.done{background:var(--green);border-color:var(--green);color:#fff}
.strip button.part{background:#E8EDE4;border-color:#C4CFBD;color:var(--green)}
.strip button.cur{box-shadow:0 0 0 2px var(--ivory),0 0 0 3.5px var(--gold);color:var(--midnight)}
.strip button.done.cur{color:#fff}

/* Players */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:16px 10px 14px;text-align:center;width:100%}
.mono{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;background:var(--midnight);color:var(--goldlt);
  font-family:var(--serif);font-size:26px;font-weight:600;box-shadow:inset 0 0 0 2px var(--midnight),inset 0 0 0 3px var(--gold)}
.mono.lg{width:92px;height:92px;font-size:38px}
.pcard .pn{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--midnight);margin-top:8px;line-height:1.1}
.pcard .ps{font-size:12px;color:var(--muted);margin-top:3px}
.pcard .pp{font-size:13px;color:var(--golddk);margin-top:6px;font-weight:500}
.back{border:0;background:none;color:var(--golddk);font-size:15px;padding:6px 0;margin-bottom:4px}
.prof{text-align:center;padding:6px 0 4px}
.prof .pn{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--midnight);margin-top:8px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.stat{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:600;color:var(--midnight);line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.rsum{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--hair2)}
.rsum:first-child{border-top:0;padding-top:2px}
.rsum .c{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--midnight)}
.rsum .d{font-size:12px;color:var(--muted)}
.rsum .v{grid-row:1/3;grid-column:2;text-align:right;font-size:22px;font-weight:600;color:var(--midnight)}
.rsum .v small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#EEE8DB;margin:10px 0 8px}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Scorecard table */
.cardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
table.sc-t{border-collapse:collapse;font-size:13px;min-width:100%}
table.sc-t th,table.sc-t td{border-bottom:1px solid var(--hair2);text-align:center;padding:5px 0;min-width:27px}
table.sc-t th{color:var(--muted);font-weight:500;font-size:11px}
table.sc-t td.l{text-align:left;padding-left:2px;color:var(--muted);min-width:46px;font-size:12px}
table.sc-t .rc{display:block;font-size:10px;font-weight:600;color:var(--golddk);line-height:1;margin-top:1px}
table.sc-t tr.p td{color:var(--green);font-weight:600}
table.sc-t td.s{font-weight:600;color:var(--midnight);background:#F6F1E6}
details.fold{border-top:1px solid var(--hair2);padding-top:8px;margin-top:8px}
details.fold summary{cursor:pointer;color:var(--golddk);font-size:14px;font-weight:500;list-style:none;padding:4px 0}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:' +';}
details.fold[open] summary::after{content:' −';}

/* Programme */
.hero{text-align:center;padding:8px 0 4px}
.hero img{width:min(190px,52vw);height:auto;border-radius:50%;filter:drop-shadow(0 4px 10px rgba(13,27,51,.15))}
.tl{position:relative;margin:6px 0 0 6px;padding-left:18px;border-left:1px solid var(--goldlt)}
.tl .d{position:relative;padding:0 0 16px}
.tl .d::before{content:'';position:absolute;left:-23.5px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--ivory);border:1.5px solid var(--gold)}
.tl .d h3{margin:0 0 3px;font-size:20px}
.tl .d p{font-size:15px;color:#3F4149;margin:2px 0}
.course{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;margin:0 0 16px}
.photo{position:relative;aspect-ratio:16/10;background:var(--midnight);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--goldlt);
  background:radial-gradient(120% 90% at 50% 110%, #22385F 0%, #0D1B33 60%)}
.photo .ph svg{width:70%;max-width:320px;opacity:.9}
.photo .ph span{font-family:var(--serif);font-style:italic;font-size:15px;color:#9FA9BC;margin-top:6px}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(13,27,51,.85));color:#fff}
.photo .cap .dt{font-size:12px;color:var(--goldlt)}
.photo .cap .cn{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.05}
.cbody{padding:14px 14px 12px}
.member{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--golddk);border:1px solid var(--goldlt);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair2);border-radius:12px;overflow:hidden;margin:6px 0 12px}
.kv div{padding:9px 6px;text-align:center;border-right:1px solid var(--hair2);border-bottom:1px solid var(--hair2)}
.kv div:nth-child(3n){border-right:0}
.kv div:nth-last-child(-n+3){border-bottom:0}
.kv b{display:block;font-size:18px;font-weight:600;color:var(--midnight);line-height:1.15}
.kv span{font-size:11px;color:var(--muted)}
.site{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 2px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;color:var(--midnight);text-decoration:none;font-weight:500;font-size:15px;background:#FBF9F4}
.site span{color:var(--golddk)}
.stats-card{padding:4px 14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair2)}
.srow:first-child{border-top:0}
.srow .sl{font-size:12px;color:var(--muted)}
.srow .sw{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--midnight);line-height:1.15}
.srow .sv{font-size:13px;color:var(--golddk);font-weight:500;text-align:right;flex:none;max-width:45%}
.conf{padding:12px 0;border-top:1px solid var(--hair2)}
.conf:first-child{border-top:0}
.conf .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.conf .opts button{border:1px solid var(--hair);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;text-align:left;min-height:44px}
.conf .opts button.cur{border-color:var(--gold);background:#F4EEDF}
.conf .opts b{font-size:18px;margin-right:6px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--hair2);font-size:14px}
.brow:first-child{border-top:0}
.brow .btns{margin:0;flex:none}
.ngf{font-size:14px}
.ngf dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.ngf dt{color:var(--muted)} .ngf dd{margin:0;font-weight:500}

/* Forms */
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.t,select.t{width:100%;border:1px solid var(--hair);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;min-height:46px}
.plist .pl{display:grid;grid-template-columns:1fr 76px 44px;gap:6px;align-items:center;margin-top:8px}
.plist .ch{font-size:12px;color:var(--muted);margin:4px 0 6px 2px}
.x{border:1px solid var(--hair);background:#fff;border-radius:10px;height:46px;color:var(--claret);font-size:20px}
.fl{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center;padding:3px 0}
.fl .seg{margin:0}
.cgrid{display:grid;grid-template-columns:34px repeat(3,1fr);gap:5px;align-items:center;font-size:13px}
.cgrid input{width:100%;border:1px solid var(--hair);border-radius:8px;padding:8px 4px;text-align:center;background:#fff;font-size:16px}
.cgrid .h{color:var(--muted);text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;margin-top:8px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,27,51,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid rgba(176,141,76,.6);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;border:0;background:none;color:#8E99AF;padding:9px 2px 8px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:.2px}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--goldlt)}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--midnight);color:#fff;border:1px solid rgba(176,141,76,.5);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;z-index:30;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:360px){
  .prow{grid-template-columns:1fr 46px 52px 46px 34px;padding:10px 10px}
  .hrow{grid-template-columns:26px 1fr 30px 30px 30px 42px}
  .hrow .nm{font-size:19px}
}

<nav class="tabs"><div class="tabs-in" id="tabs">

  <button data-tab="admin"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7 7 0 0 1-1.9 1.1L15 20h-3.6l-.3-1.8a7 7 0 0 1-1.9-1.1l-1.9.7-1.8-3.1 1.6-1.2a7 7 0 0 1 0-2.2L5.5 10l1.8-3.1 1.9.7a7 7 0 0 1 1.9-1.1L11.4 4H15l.3 2.5a7 7 0 0 1 1.9 1.1l1.9-.7L20.9 10l-1.6 1.3a7 7 0 0 1 .1 2.2z"/></svg>Beheer</button>
</div></nav>
<div id="toast" role="status"></div>

<script>
/* ============ Config ============ */
const API = 'https://xryjzjhfvqwptgkvlgur.supabase.co/rest/v1';
const KEY = 'sb_publishable_b2BCSdU4dPu6UZxO8cR66Q_-S0jRO_H';
const LS  = 'gif_state_v1';
const DEFAULT_PIN = '1589';
const YD = 0.9144;

/* Course data, yellow men's tees. Everything except the texts can be overridden in Beheer. */
const DEFAULT_COURSES = {
  1:{ name:'Lundin Golf Club', short:'Lundin', dayname:'Vrijdag', day:'Vrijdag 2 oktober', date:'2026-10-02', tees:'11.00 en 11.10 uur',
      par:[4,4,4,4,3,4,4,4,5, 4,4,3,5,3,4,4,4,4],
      si: [5,11,14,1,18,9,16,7,3, 10,2,17,8,15,4,13,12,6],
      yds:[403,339,312,415,128,325,266,355,546, 348,447,140,490,170,417,280,330,427], totalYds:6138,
      names:null, cr:70.2, slope:130, check:'',
      founded:'1868', architect:'Old Tom Morris, James Braid (1909)', member:'Folpmer', url:'https://lundingolfclub.co.uk/',
      desc:'Een klassieke Fife-links tussen Lundin Links en Lower Largo, aan de Firth of Forth. De eerste vijf en de laatste vier holes zijn pure links langs de kust; daartussen steek je de oude spoorlijn over naar negen holes die James Braid in 1909 toevoegde. Verwacht burns, blinde tee shots, out of bounds langs de voormalige spoorbaan en greens die tot de beste van de regio horen. Lundin was jarenlang kwalificatiebaan voor The Open in St Andrews.' },
  2:{ name:'The Golf House Club, Elie', short:'Elie', dayname:'Zaterdag', day:'Zaterdag 3 oktober', date:'2026-10-03', tees:'11.00 en 11.10 uur',
      par:[4,4,3,4,4,4,4,4,4, 4,3,4,4,4,4,4,4,4],
      si: [12,3,17,6,13,7,15,1,10, 9,18,2,11,5,16,4,14,8],
      yds:null, totalYds:6009, names:null, cr:69.3, slope:121,
      check:'Stroke index per hole komt van de witte kaart. Controleer hem tegen de gele scorekaart van de club.',
      founded:'Clubhuis 1875, golf sinds de 16e eeuw', architect:'Old Tom Morris, James Braid', member:'Mathijs', url:'https://www.golfhouseclub.co.uk/',
      desc:'Op deze links wordt al eeuwen gegolfd en de club behoort tot de oudste ter wereld. Elie telt geen enkele par 5 en maar twee par 3’s, en is daardoor een baan van precisie in plaats van lengte. Op de eerste hole sla je blind over een heuvel; de starter kijkt met een periscoop uit een Royal Navy-onderzeeër of de fairway vrij is. Hole 10 tot en met 13 liggen spectaculair langs de zee.' },
  3:{ name:'Crail Golfing Society, Balcomie Links', short:'Crail', dayname:'Zondag', day:'Zondag 4 oktober', date:'2026-10-04', tees:'tijd volgt',
      par:[4,5,3,4,4,3,4,4,4, 4,5,5,3,3,4,3,4,3],
      si: [11,7,15,5,1,13,9,3,17, 8,10,4,6,18,14,16,2,12],
      yds:[313,451,168,315,439,172,273,416,250, 287,427,517,207,141,254,157,417,198], totalYds:5402,
      names:['Boathouse','Over the Knowe','The Briggs','Fluke Dub',"Hell's Hole",'Wormison','North Carr','Breeches Buoy','Dykeside',
             'Castle Yetts','Lang Whang','The Burn','Craighead','The Cave','Mill Dam','Spion Kop','Road Hole','The Quarry'],
      cr:67.6, slope:118,
      check:'Alleen hole 5 (SI 1) is bevestigd. De overige stroke indexen, rating en slope zijn voorlopig. Neem ze over van de scorekaart op de club.',
      founded:'1786, links 1895', architect:'Old Tom Morris', member:'Serge', url:'https://crailgolfingsociety.co.uk/golf/balcomie-links/',
      desc:'De Crail Golfing Society is de zevende oudste golfclub ter wereld. Old Tom Morris legde Balcomie in 1895 aan op het uiterste oostpunt van Fife, met de Noordzee op vrijwel elke hole in beeld. Par 69 met zes par 3’s: kort op papier, maar de wind maakt het verschil. Let op Hell’s Hole (5), een dogleg rond de baai, en The Cave (14), een par 3 die diep naar de kust afdaalt. Het clubhuis kijkt uit over de laatste holes.' }
};

/* ============ State ============ */
function blank(){ return {players:[], scores:{}, settings:{}, photos:{}, photoDirty:{}, outbox:{}, dirty:{players:false,settings:false}, deleted:[], op:null, lastSync:null}; }
let state = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); return s ? Object.assign(blank(), s) : blank(); }catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){ toast('Opslag op deze telefoon is vol'); } }

let DEV = (()=>{ try{ return JSON.parse(localStorage.getItem('gif_device')) || null; }catch(e){ return null; } })();
if (!DEV){ DEV = { id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), name:'' }; localStorage.setItem('gif_device', JSON.stringify(DEV)); }
function setDeviceName(n){ DEV.name=n; localStorage.setItem('gif_device', JSON.stringify(DEV)); }
const ui = { tab: sessionStorage.getItem('gif_tab') || 'prog', round: defaultRound(), flight:'A', hole:1,
  boardView: sessionStorage.getItem('gif_bview') || 'tot', courseMode:'list', expanded:{}, player:null,
  admin: sessionStorage.getItem('gif_admin')==='1' };
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function defaultRound(){ const iso=todayIso(); if (iso >= '2026-10-04') return 3; if (iso === '2026-10-03') return 2; return 1; }

/* ============ Golf maths ============ */
const sum = a => a.reduce((x,y)=>x+y,0);
function course(r){ const o = (state.settings.courses||{})[r] || {}; return Object.assign({}, DEFAULT_COURSES[r], o); }
function meters(c){ return c.yds ? Math.round(sum(c.yds.map(y=>y||0))*YD) : Math.round(c.totalYds*YD); }
function players(){ return [...state.players].sort((a,b)=>(a.sort||0)-(b.sort||0)); }
function pById(id){ return state.players.find(p=>p.id===id); }
function playingHcp(p, r){ const c=course(r), hi=Number(p.hcp)||0; return Math.round(hi*c.slope/113 + (c.cr - sum(c.par))); }
function received(ph, si){
  if (ph >= 0) return Math.floor(ph/18) + (si <= ph % 18 ? 1 : 0);
  const p = -ph; return -(Math.floor(p/18) + (si > 18 - (p % 18) ? 1 : 0));
}
function points(s, par, rc){ if (s===undefined || s===null) return null; if (s===0) return 0; return Math.max(0, 2 + par + rc - s); }
const k = (pid,r,h) => pid+'|'+r+'|'+h;
function getS(pid,r,h){ const v = state.scores[k(pid,r,h)]; return v ? v.s : undefined; }
const has = s => s!==undefined && s!==null;
function holeInfo(p, r, h){
  const c = course(r), ph = playingHcp(p,r), rc = received(ph, c.si[h-1]), s = getS(p.id,r,h);
  return { par:c.par[h-1], si:c.si[h-1], rc, s, pts: points(s, c.par[h-1], rc) };
}
function roundStats(p, r){
  let pts=0, thru=0, gross=0, pu=false, last=0; const per=[], info=[];
  for (let h=1; h<=18; h++){ const i = holeInfo(p,r,h); per.push(i.pts); info.push(i);
    if (has(i.s)){ thru++; last=h; pts+=i.pts; if (i.s>0) gross+=i.s; else pu=true; } }
  return { pts, thru, gross, pu, per, info, last };
}
function lastPlayedRound(){ for (let r=3;r>=1;r--) if (state.players.some(p=>roundStats(p,r).thru>0)) return r; return 1; }
function countback(per){ const s=(a,b)=>sum(per.slice(a,b).map(x=>x||0)); return [s(9,18), s(12,18), s(15,18), s(17,18)]; }
function ranking(view){
  const lr = view==='tot' ? lastPlayedRound() : Number(view);
  const rows = players().map(p=>{
    const rs = [1,2,3].map(r=>roundStats(p,r));
    const main = view==='tot' ? sum(rs.map(x=>x.pts)) : rs[lr-1].pts;
    return { p, rs, main, tb:[ ...(view==='tot'?[rs[lr-1].pts]:[]), ...countback(rs[lr-1].per) ] };
  });
  rows.sort((a,b)=>{ if (b.main!==a.main) return b.main-a.main; for (let i=0;i<a.tb.length;i++) if (b.tb[i]!==a.tb[i]) return b.tb[i]-a.tb[i]; return a.p.name.localeCompare(b.p.name); });
  rows.forEach((r,i)=>{ const prev=rows[i-1]; r.pos = (prev && prev.main===r.main && prev.tb.join()===r.tb.join()) ? prev.pos : i+1; });
  return rows;
}
function flights(r){
  const f = ((state.settings.flights||{})[r]) || {}; const ps = players(); const A=[], B=[];
  ps.forEach((p,i)=>{ const g = f[p.id] || (i<Math.ceil(ps.length/2)?'A':'B'); (g==='A'?A:B).push(p); });
  return {A,B};
}
function flightOf(p, r){ return flights(r).A.includes(p) ? 1 : 2; }
function distribution(p){
  const d = {e:0,b:0,p:0,o:0,d:0,x:0};
  [1,2,3].forEach(r=>{ for (let h=1;h<=18;h++){ const s=getS(p.id,r,h); if (!has(s)) continue; if (s===0){ d.x++; continue; }
    const diff = s - course(r).par[h-1]; d[diff<=-2?'e':diff===-1?'b':diff===0?'p':diff===1?'o':'d']++; } });
  return d;
}

/* ============ Statistics ============ */
function holeList(p, rounds){ const out=[]; rounds.forEach(r=>{ const c=course(r); for (let h=1;h<=18;h++){ const i=holeInfo(p,r,h); if (has(i.s)) out.push({...i,r,h,course:c.short}); } }); return out; }
function streak(p, rounds){ let best=0; rounds.forEach(r=>{ let cur=0; for (let h=1;h<=18;h++){ const i=holeInfo(p,r,h); if (has(i.s) && i.pts>=2){ cur++; best=Math.max(best,cur); } else cur=0; } }); return best; }
function leaders(rows, key, min=1){
  const vals = rows.map(x=>({p:x.p, v:x[key]})).filter(x=>x.v>=min); if (!vals.length) return null;
  const top = Math.max(...vals.map(x=>x.v)); return { v:top, names: vals.filter(x=>x.v===top).map(x=>first(x.p.name)) };
}
function joinNames(a){ return a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' en '+a[a.length-1]; }
function statsFor(rounds){
  const rows = players().map(p=>{
    const hl = holeList(p, rounds);
    const nine = []; rounds.forEach(r=>{ const rs=roundStats(p,r); [[0,9],[9,18]].forEach(([a,b])=>{ const seg=rs.info.slice(a,b); if (seg.every(i=>has(i.s))) nine.push(sum(seg.map(i=>i.pts))); }); });
    const rnds = rounds.map(r=>roundStats(p,r)).filter(x=>x.thru===18).map(x=>x.pts);
    const hi = hl.reduce((m,i)=>i.pts>m.pts?i:m, {pts:-1});
    return { p, birdies: hl.filter(i=>i.s>0 && i.s<i.par).length, pars: hl.filter(i=>i.s===i.par).length,
      zeros: hl.filter(i=>i.pts===0).length, best9: nine.length?Math.max(...nine):0, bestRound: rnds.length?Math.max(...rnds):0,
      streak: streak(p, rounds), topHole: hi.pts, topHoleAt: hi.pts>=0 ? `${hi.course} ${hi.h}` : '' };
  });
  const out = [];
  const add = (label, l, unit, extra='') => { if (l) out.push({label, who: joinNames(l.names), val: `${l.v} ${unit}${extra}`}); };
  add('Meeste birdies', leaders(rows,'birdies'), 'birdies', ', bruto');
  add('Meeste pars', leaders(rows,'pars'), 'pars', ', bruto');
  if (rounds.length>1) add('Beste ronde', leaders(rows,'bestRound'), 'punten');
  add('Beste negen holes', leaders(rows,'best9'), 'punten');
  add('Langste reeks van 2+ punten', leaders(rows,'streak',3), 'holes op rij');
  const th = leaders(rows,'topHole',4);
  if (th){ const who = rows.filter(x=>x.topHole===th.v).map(x=>`${first(x.p.name)} (${x.topHoleAt})`); out.push({label:'Meeste punten op één hole', who: joinNames(who), val:`${th.v} punten`}); }
  add('Meeste strepen en nullen', leaders(rows,'zeros',2), 'holes', ', de poedelprijs');
  return out;
}
function prizeHtml(r){
  const pr = ((state.settings.prizes||{})[r]) || {}, out=[];
  [['nearest','Nearest the pin'],['longest','Longest drive']].forEach(([k,l])=>{ const x=pr[k]; if (x && x.pid && pById(x.pid)) out.push({label:l, who:pById(x.pid).name, val:[x.hole?`hole ${x.hole}`:'', x.note||''].filter(Boolean).join(', ')}); });
  return out;
}
function statList(items){ return items.map(x=>`<div class="srow"><div><div class="sl">${esc(x.label)}</div><div class="sw">${esc(x.who)}</div></div><div class="sv">${esc(x.val)}</div></div>`).join(''); }

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'), 2400); }
function fmtHcp(v){ v=Number(v)||0; return v<0 ? '+'+Math.abs(v).toFixed(1) : v.toFixed(1); }
function first(n){ return String(n||'').split(' ')[0]; }
function initials(n){ const w=String(n||'?').trim().split(/\s+/); return ((w[0]||'?')[0] + (w.length>1 ? w[w.length-1][0] : '')).toUpperCase(); }
function mark(s, par, cls=''){
  if (!has(s)) return `<span class="mk n ${cls}">·</span>`; if (s===0) return `<span class="mk x ${cls}">–</span>`;
  const d = s-par, c = d<=-2?'e':d===-1?'b':d===1?'o':d>=2?'d':'';
  return `<span class="mk ${c} ${cls}">${s}</span>`;
}
function ordinal(n){ return n+'e'; }
function isLive(r){ const rows = state.players.map(p=>roundStats(p,r).thru); return rows.some(t=>t>0 && t<18); }

/* ============ Render ============ */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  const v = $('#view');
  if (ui.tab==='board') v.innerHTML = viewBoard();
  else if (ui.tab==='score') v.innerHTML = viewScore();
  else if (ui.tab==='players') v.innerHTML = ui.player && pById(ui.player) ? viewProfile(pById(ui.player)) : viewPlayers();
  else if (ui.tab==='prog') v.innerHTML = viewProg();
  else v.innerHTML = ui.admin ? viewAdmin() : viewPin();
  renderSync(); wake();
}
function roundSeg(cur, act){
  return `<div class="seg">${[1,2,3].map(r=>{const c=course(r);return `<button class="${cur===r?'on':''}" data-act="${act}" data-v="${r}">${esc(c.short)}<small>${c.dayname}</small></button>`}).join('')}</div>`;
}

/* ---- Stand ---- */
function viewBoard(){
  const opts = [['tot','Totaal'],['1',course(1).short],['2',course(2).short],['3',course(3).short]];
  let h = `<div class="stick"><div class="seg">${opts.map(([v,l])=>`<button class="${ui.boardView===v?'on':''}" data-act="bview" data-v="${v}">${esc(l)}</button>`).join('')}</div></div>`;
  const rows = ranking(ui.boardView);
  const upd = state.lastSync ? new Date(state.lastSync).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '–';
  if (ui.boardView==='tot'){
    const any = rows.some(r=>r.rs.some(x=>x.thru>0));
    h += `<div class="meta"><span>Stableford over 54 holes</span><span>Bijgewerkt ${upd}</span></div>`;
    h += `<div class="honours"><p class="ttl">Klassement</p><p class="st">${any?'Stand na '+['','Lundin','Elie','Crail'][lastPlayedRound()]:'Eerste afslag vrijdag om 11.00 uur'}</p>`;
    if (!rows.length) h += `<div class="empty">Voeg de spelers toe onder Beheer.</div>`;
    else {
      h += `<div class="hrow head"><span></span><span style="text-align:left">Speler</span><span>Lun</span><span>Elie</span><span>Crail</span><span style="text-align:right">Tot</span></div>`;
      rows.forEach(r=>{
        h += `<button class="hrow ${r.pos===1&&any?'first':''}" data-act="openp" data-p="${r.p.id}"><span class="pos">${any?r.pos:''}</span><span class="nm">${esc(r.p.name)}<small>hcp ${fmtHcp(r.p.hcp)}</small></span>`;
        r.rs.forEach(x=>{ h += x.thru ? `<span class="rd num">${x.pts}${x.thru<18?`<sup>${x.thru}</sup>`:''}</span>` : `<span class="rd none">–</span>`; });
        h += `<span class="tot num">${any?r.main:'–'}</span></button>`;
      });
    }
    const wk = statsFor([1,2,3]);
    const pz = [1,2,3].flatMap(r=>prizeHtml(r).map(x=>({...x, label:`${x.label}, ${course(r).short}`})));
    h += `</div>`;
    if (wk.length || pz.length) h += `<h2>Statistieken van het weekend</h2><div class="card stats-card">${statList(pz)}${statList(wk)}</div>`;
    h += `<p class="tiny muted" style="margin:10px 2px">Een klein cijfer bij een score is het aantal gespeelde holes van een lopende ronde. Bij gelijke stand beslist de laatste ronde, daarna de laatste 9, 6, 3 en 1 hole. Tik op een naam voor de scorekaart.</p>`;
    return h;
  }
  const r = Number(ui.boardView), c = course(r), live = isLive(r);
  const any = rows.some(x=>x.rs[r-1].thru>0);
  h += `<div class="meta"><span>${c.day}, par ${sum(c.par)}</span><span>${live?'<b style="color:var(--claret);font-weight:500">Live</b>, ':''}bijgewerkt ${upd}</span></div>`;
  h += `<div class="seg" style="max-width:220px"><button class="${ui.courseMode==='list'?'on':''}" data-act="cmode" data-v="list">Stand</button><button class="${ui.courseMode==='matrix'?'on':''}" data-act="cmode" data-v="matrix">Alle holes</button></div>`;
  if (!rows.length) return h + `<div class="card">Voeg de spelers toe onder Beheer.</div>`;
  if (ui.courseMode==='matrix'){
    h += `<div class="mx"><table class="num"><thead><tr><th class="sticky">Hole</th>${c.par.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>Pnt</th></tr>
      <tr><th class="sticky">Par</th>${c.par.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>`;
    rows.forEach(x=>{ const s=x.rs[r-1];
      h += `<tr><td class="sticky">${esc(first(x.p.name))}</td>${s.info.map(i=>`<td>${has(i.s)?mark(i.s,i.par):'<span class="mk n">·</span>'}</td>`).join('')}<td class="tot">${s.thru?s.pts:'–'}</td></tr>`; });
    h += `</tbody></table></div><p class="tiny muted" style="margin:8px 2px">Bruto scores. Cirkel is birdie, gevulde cirkel eagle, vierkant bogey, gevuld vierkant dubbel bogey of slechter.</p>`;
    return h;
  }
  h += `<div class="lb"><div class="lrow head"><span></span><span>Speler</span><span>Hole</span><span style="text-align:right">Pnt</span></div>`;
  rows.forEach(x=>{ const s=x.rs[r-1], open=ui.expanded[x.p.id];
    const thru = s.thru===18 ? '<span class="thru f">F</span>' : s.thru ? `<span class="thru on num">${s.last}</span>` : '<span class="thru">–</span>';
    h += `<button class="lrow" data-act="exp" data-p="${x.p.id}" aria-expanded="${!!open}"><span class="pos">${any&&s.thru?x.pos:''}</span>
      <span class="nm">${esc(x.p.name)}<small>PH ${playingHcp(x.p,r)}, flight ${flightOf(x.p,r)}${s.thru&&!s.pu&&s.thru===18?`, ${s.gross} bruto`:''}</small></span>${thru}
      <span class="pts num">${s.thru?s.pts:'–'}</span></button>`;
    if (open){
      h += `<div class="exp">`;
      [[0,9],[9,18]].forEach(([a,b])=>{
        h += `<div class="holes num">${s.info.slice(a,b).map((i,j)=>`<div><div class="hn">${a+j+1}</div>${mark(i.s,i.par)}<div class="hp">${i.pts===null?'':i.pts}</div></div>`).join('')}</div>`; });
      h += `<div class="btns"><button class="btn sm alt" data-act="openp" data-p="${x.p.id}">Volledige scorekaart</button></div></div>`;
    }
  });
  h += `</div>`;
  const done = rows.every(x=>x.rs[r-1].thru===18);
  const day = [];
  if (any){ const top = rows.filter(x=>x.pos===1); day.push({label: done?'Dagwinnaar':'Leidt nu', who: joinNames(top.map(x=>x.p.name)), val:`${top[0].main} punten`}); }
  const items = [...day, ...prizeHtml(r), ...statsFor([r])];
  if (items.length) h += `<h2>Uitslag van de dag</h2><div class="card stats-card">${statList(items)}</div>`;
  return h;
}

/* ---- Score entry ---- */
function viewScore(){
  const r = ui.round, c = course(r), fl = flights(r), grp = fl[ui.flight];
  let h = roundSeg(r,'round');
  h += `<div class="seg"><button class="${ui.flight==='A'?'on':''}" data-act="flight" data-v="A">Flight 1<small>${fl.A.map(p=>esc(first(p.name))).join(', ')||'leeg'}</small></button><button class="${ui.flight==='B'?'on':''}" data-act="flight" data-v="B">Flight 2<small>${fl.B.map(p=>esc(first(p.name))).join(', ')||'leeg'}</small></button></div>`;
  if (!state.players.length) return h + `<div class="card">Er zijn nog geen spelers. Voeg ze toe onder Beheer.</div>`;
  if (!grp.length) return h + `<div class="card">Deze flight is leeg. Verdeel de spelers onder Beheer.</div>`;
  if (!DEV.name) return h + `<div class="card"><h3 style="margin-top:0">Wie voert in op deze telefoon?</h3><p class="small muted">Dan kan de beheerder achteraf zien wie welke score heeft doorgegeven.</p>
    <select class="t" id="devname">${players().map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><div class="btns"><button class="btn" data-act="setdev">Opslaan</button></div></div>`;
  const hole = ui.hole, par = c.par[hole-1], si = c.si[hole-1];
  const name = c.names ? c.names[hole-1] : c.short;
  const yds = c.yds && c.yds[hole-1] ? c.yds[hole-1] : null;
  h += `<div class="hole"><div class="holehead"><div class="holenum">${hole}</div><div class="holeinfo">
        <div class="nm">${esc(name)}</div>
        <div class="facts"><span>Par <b>${par}</b></span><span>Index <b>${si}</b></span>${yds?`<span><b>${Math.round(yds*YD)}</b> m</span>`:''}</div></div></div>`;
  grp.forEach(p=>{
    const i = holeInfo(p,r,hole), rs = roundStats(p,r);
    const st = i.rc>0 ? `${i.rc} ${i.rc===1?'slag':'slagen'}` : (i.rc<0 ? `geeft ${-i.rc}` : 'geen slag');
    const scTxt = !has(i.s) ? '–' : (i.s===0 ? 'streep' : i.s);
    const cls = !has(i.s) ? 'empty' : (i.s===0 ? 'pu' : (i.s < par ? 'b' : ''));
    const pc = i.pts===null ? '' : 'p'+Math.min(i.pts,4);
    h += `<div class="prow">
      <div class="pname">${esc(p.name)}<small><span class="st">${st}</span>, ${rs.pts} pnt na ${rs.thru}</small></div>
      <button class="pm" data-act="dec" data-p="${p.id}" aria-label="Eén slag minder voor ${esc(p.name)}">−</button>
      <button class="sc num ${cls}" data-act="setpar" data-p="${p.id}" aria-label="Score ${esc(p.name)}">${scTxt}</button>
      <button class="pm" data-act="inc" data-p="${p.id}" aria-label="Eén slag meer voor ${esc(p.name)}">+</button>
      <div class="ptsb num ${pc}">${i.pts===null?'':i.pts}<small>${i.pts===null?'':'pnt'}</small></div>
      <button class="pu-link" data-act="pickup" data-p="${p.id}">${i.s===0?'Streep weghalen':'Streep'}</button>
    </div>`;
  });
  h += `<div class="holenav"><button class="btn alt" data-act="hole" data-v="${Math.max(1,hole-1)}" ${hole===1?'disabled':''}>Vorige</button><button class="btn" data-act="hole" data-v="${Math.min(18,hole+1)}" ${hole===18?'disabled':''}>Volgende hole</button></div>`;
  h += `<div class="strip num">${Array.from({length:18},(_,i)=>i+1).map(n=>{
      const cnt = grp.filter(p=>has(getS(p.id,r,n))).length;
      return `<button class="${cnt===grp.length?'done':cnt?'part':''} ${n===hole?'cur':''}" data-act="hole" data-v="${n}">${n}</button>`;}).join('')}</div></div>`;
  h += `<p class="tiny muted" style="margin:0 2px 10px">Invoer op deze telefoon door ${esc(DEV.name)}. <button class="pu-link" style="font-size:12px;margin:0;padding:0" data-act="resetdev">Wijzigen</button></p>`;
  const pend = Object.keys(state.outbox).length;
  if (pend) h += `<div class="note">${pend} ${pend===1?'score staat':'scores staan'} veilig op deze telefoon en ${pend===1?'wordt':'worden'} verstuurd zodra er bereik is.</div>`;
  return h;
}

function viewProfile(p){
  const rk = ranking('tot'), me = rk.find(r=>r.p.id===p.id), any = rk.some(r=>r.rs.some(x=>x.thru));
  const d = distribution(p), tot = sum(Object.values(d));
  let h = `<button class="back" data-act="closep">‹ Alle spelers</button>
    <div class="prof"><span class="mono lg">${esc(initials(p.name))}</span><div class="pn">${esc(p.name)}</div>
    <div class="small muted" style="margin-top:6px">Handicapindex ${fmtHcp(p.hcp)}</div></div>
    <div class="stats"><div class="stat"><b class="num">${any?me.pos:'–'}</b><span>Positie</span></div><div class="stat"><b class="num">${me.main}</b><span>Punten</span></div><div class="stat"><b class="num">${sum(me.rs.map(x=>x.thru))}</b><span>Holes</span></div></div>`;
  h += `<div class="card">`;
  [1,2,3].forEach(r=>{ const c=course(r), s=me.rs[r-1];
    h += `<div class="rsum"><div class="c">${esc(c.short)}</div><div class="d">${c.dayname}, PH ${playingHcp(p,r)}, flight ${flightOf(p,r)}${s.thru===18&&!s.pu?`, ${s.gross} bruto`:''}</div>
      <div class="v num">${s.thru?s.pts:'–'}<small>${s.thru===18?'punten':s.thru?`na ${s.thru} holes`:'nog te spelen'}</small></div></div>`; });
  h += `</div>`;
  if (tot){
    const cols = [['e','Eagle of beter','#B08D4C'],['b','Birdie','#D8C18F'],['p','Par','#2F4B37'],['o','Bogey','#8A93A5'],['d','Dubbel+','#16294A'],['x','Streep','#C9C3B6']];
    h += `<h3>Scoreverdeling</h3><div class="dist">${cols.map(([kk,,col])=>d[kk]?`<span style="width:${d[kk]/tot*100}%;background:${col}"></span>`:'').join('')}</div>
      <div class="legend">${cols.filter(([kk])=>d[kk]).map(([kk,l,col])=>`<span><i style="background:${col}"></i>${l} ${d[kk]}</span>`).join('')}</div>`;
  }
  h += `<h3>Scorekaarten</h3>`;
  [1,2,3].forEach(r=>{ const c=course(r), s=me.rs[r-1];
    h += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-family:var(--serif);font-size:19px;color:var(--midnight)">${esc(c.short)}</b><span class="small muted">${s.thru?`${s.pts} punten`:'Nog niet gespeeld'}</span></div><div class="tiny muted">Playing handicap ${playingHcp(p,r)}. Bij de par staat hoeveel slagen je op die hole krijgt.</div>`;
    [[1,9,'Uit'],[10,18,'In']].forEach(([a,b,lbl])=>{
      let hh=`<th></th>`, par=`<td class="l">Par</td>`, si=`<td class="l">Index</td>`, g=`<td class="l">Score</td>`, pt=`<td class="l">Punten</td>`;
      let sp=0, sg=0, spt=0, ok=true;
      for (let n=a;n<=b;n++){ const i=s.info[n-1]; hh+=`<th>${n}</th>`;
        par+=`<td>${i.par}${i.rc?`<span class="rc">${i.rc>0?'+':'−'}${Math.abs(i.rc)}</span>`:''}</td>`;
        si+=`<td>${i.si}</td>`;
        sp+=i.par; g+=`<td>${has(i.s)?mark(i.s,i.par):''}</td>`; pt+=`<td>${i.pts===null?'':i.pts}</td>`;
        if (i.s>0) sg+=i.s; else ok=false; spt+=i.pts||0; }
      hh+=`<th>${lbl}</th>`; par+=`<td class="s">${sp}</td>`; si+=`<td class="s"></td>`; g+=`<td class="s">${ok?sg:''}</td>`; pt+=`<td class="s">${spt}</td>`;
      h += `<div class="cardwrap"><table class="sc-t num"><thead><tr>${hh}</tr></thead><tbody><tr>${par}</tr><tr>${si}</tr><tr>${g}</tr><tr class="p">${pt}</tr></tbody></table></div>`;
    });
    h += `</div>`;
  });
  return h;
}

function ngfRows(c, o){
  const par=c.par.slice(o,o+9), si=c.si.slice(o,o+9), m=c.yds?c.yds.slice(o,o+9).map(y=>y?Math.round(y*YD):''):Array(9).fill('');

    <tr><td class="l">Meter</td>${m.map(x=>`<td>${x||'–'}</td>`).join('')}<td class="s">${mt}</td></tr>`;
}
function ngfText(r){
  const c = course(r);

}

function conflicts(){
  const res = state.settings.resolved || {}, by = {};
  (ui.log||[]).forEach(e=>{ const kk=k(e.player_id,e.round_no,e.hole); if (res[kk] && new Date(e.updated_at) <= new Date(res[kk])) return;
    const dev = e.device || e.device_name || '?'; (by[kk] = by[kk] || {})[dev] = e; });
  const out = [];
  Object.entries(by).forEach(([kk,devs])=>{
    const latest = Object.values(devs); const vals = [...new Set(latest.map(e=>e.strokes))];
    if (vals.length<2) return;
    const [pid,r,h] = kk.split('|');
    out.push({ pid, r:+r, h:+h, cur:getS(pid,+r,+h),
      opts: vals.map(v=>({ v, who: latest.filter(e=>e.strokes===v).map(e=>`${e.device_name||'onbekend'} ${new Date(e.updated_at).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`).join(', ') })) });
  });
  return out.sort((a,b)=>a.r-b.r || a.h-b.h);
}

function setScore(pid, val){
  const kk = k(pid, ui.round, ui.hole);
  state.scores[kk] = { s: val, t: new Date().toISOString() };
  state.outbox[kk] = true; save(); render(); schedulePush();
  if (navigator.vibrate) navigator.vibrate(8);
}
function markDirty(what){ state.dirty[what] = true; save(); schedulePush(); }
function setCourse(r, patch){
  const cs = state.settings.courses = state.settings.courses || {};
  const cur = course(r);
  cs[r] = Object.assign({}, cs[r]||{}, { par:[...cur.par], si:[...cur.si], yds: cur.yds?[...cur.yds]:null, cr:cur.cr, slope:cur.slope }, patch);
  markDirty('settings');
}
function firstOpenHole(){
  const grp = flights(ui.round)[ui.flight];

  return 18;
}

document.addEventListener('change', async e=>{
  const el = e.target;
  if (el.id==='restorefile'){ const f=el.files[0]; if (f) restoreFrom(f); el.value=''; return; }
  if (el.id==='photofile'){ const f=el.files[0]; el.value=''; if (!f || !photoRound) return;
    try{ const data = await compressImage(f); state.photos[photoRound]={data, t:new Date().toISOString()}; state.photoDirty[photoRound]=true; save(); render(); toast('Foto opgeslagen'); sync(); }
    catch(err){ toast('Deze foto kon niet worden gelezen'); } return; }
  const c = el.dataset.chg; if (!c) return;
  const p = el.dataset.p ? pById(el.dataset.p) : null, r = Number(el.dataset.r), h = Number(el.dataset.h);
  const num = x => { x=String(x).trim().replace(',', '.'); return x.startsWith('+') ? -Number(x.slice(1)) : Number(x); };
  switch(c){
    case 'prize': { const pz = state.settings.prizes = state.settings.prizes || {}; const x = (pz[r] = pz[r] || {}); const it = (x[el.dataset.k] = x[el.dataset.k] || {});
      it[el.dataset.f] = el.value; markDirty('settings'); break; }
    case 'pname': if (p){ p.name = el.value.trim() || p.name; markDirty('players'); render(); } break;
    case 'phcp': if (p){ const n = num(el.value); if (isNaN(n) || n>54 || n<-10){ toast('Ongeldige handicap'); render(); break; } p.hcp = Math.round(n*10)/10; markDirty('players'); render(); } break;
    case 'ccr': { const n=num(el.value); if (!isNaN(n) && n>50 && n<90) setCourse(r,{cr:n}); else toast('Course rating ligt tussen 50 en 90'); render(); break; }
    case 'cslope': { const n=parseInt(el.value,10); if (n>=55&&n<=155) setCourse(r,{slope:n}); else toast('Slope ligt tussen 55 en 155'); render(); break; }
    case 'cpar': case 'csi': case 'cyds': {
      const cur = course(r), n = parseInt(el.value,10);
      if (c==='cpar'){ if (!(n>=3&&n<=6)){ toast('Par moet 3 tot 6 zijn'); render(); break; } const a=[...cur.par]; a[h-1]=n; setCourse(r,{par:a}); }
      if (c==='csi'){ if (!(n>=1&&n<=18)){ toast('Index moet 1 tot 18 zijn'); render(); break; } const a=[...cur.si]; a[h-1]=n; setCourse(r,{si:a}); }
      if (c==='cyds'){ const a = cur.yds?[...cur.yds]:Array(18).fill(null); a[h-1]= isNaN(n)?null:n; setCourse(r,{yds:a}); }
      render(); break; }
  }
});
function compressImage(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const max=1280, s=Math.min(1, max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg',0.74)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ============ Backup / restore ============ */
function downloadBackup(){
  const data = { app:'golf-in-fife', version:2, exported_at:new Date().toISOString(),
    players: players(), settings: state.settings, photos: Object.fromEntries(Object.entries(state.photos).filter(([,v])=>v&&v.data).map(([r,v])=>[r,v.data])),
    scores: Object.entries(state.scores).map(([kk,v])=>{ const [player_id,round_no,hole]=kk.split('|'); return { player_id, round_no:+round_no, hole:+hole, strokes:v.s, updated_at:v.t }; }) };
  downloadJson(data, 'golf-in-fife-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'));
}
function downloadJson(data, name){
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Back-up gedownload');
}
async function restoreFrom(file){
  try{ await restoreData(JSON.parse(await file.text())); }catch(err){ toast('Back-up kon niet worden gelezen'); }
}
async function restoreData(d){
  try{
    if (d.app!=='golf-in-fife' || !Array.isArray(d.players)) throw new Error('Dit is geen Golf in Fife back-up.');
    if (!confirm(`Back-up van ${new Date(d.exported_at).toLocaleString('nl-NL')} terugzetten? Alle huidige gegevens worden vervangen.`)) return;
    const now = new Date().toISOString();
    state.players = d.players; state.settings = d.settings || {}; state.scores = {}; state.outbox = {};
    (d.scores||[]).forEach(s=>{ const kk=k(s.player_id,s.round_no,s.hole); state.scores[kk]={ s:s.strokes, t:now }; state.outbox[kk]=true; });
    if (d.settings && d.settings.resolved) delete state.settings.resolved;
    Object.entries(d.photos||{}).forEach(([r,data])=>{ state.photos[r]={data,t:now}; state.photoDirty[r]=true; });
    state.dirty = {players:true, settings:true}; state.deleted = []; state.op = 'replace';
    save(); render(); toast('Back-up teruggezet'); sync(true);
  }catch(err){ toast(err.message || 'Back-up kon niet worden gelezen'); }
}

/* ============ Sync (offline first) ============ */
let syncing = false, syncErr = null, pushTimer = null;
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(()=>sync(), 600); }
async function api(path, opts={}){
  const res = await fetch(API+path, { ...opts, headers:{ apikey:KEY, 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if (!res.ok){ const t = await res.text(); const err = new Error(t || res.statusText); err.status = res.status; throw err; }
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
const UPSERT = {Prefer:'resolution=merge-duplicates,return=minimal'};
async function sync(manual){
  if (syncing) return; if (!navigator.onLine){ syncErr='offline'; renderSync(); if (manual) toast('Geen verbinding, scores blijven bewaard'); return; }
  syncing = true; renderSync();
  let changed = false;
  try{
    changed = !!(state.op || state.deleted.length || state.dirty.players || state.dirty.settings || Object.keys(state.outbox).length || Object.keys(state.photoDirty).length);
    if (state.op==='replace'){ await api('/gif_players?id=neq.__none__', {method:'DELETE'}); state.deleted=[]; }
    if (state.op==='resetscores'){ await api('/gif_scores?round_no=gte.1', {method:'DELETE'}); }
    if (state.deleted.length){ await api('/gif_players?id=in.('+state.deleted.map(encodeURIComponent).join(',')+')', {method:'DELETE'}); state.deleted=[]; }
    if (state.dirty.players){
      if (state.players.length) await api('/gif_players', {method:'POST', headers:UPSERT,
        body: JSON.stringify(state.players.map(p=>({id:p.id,name:p.name,hcp:p.hcp,sort:p.sort||0,updated_at:new Date().toISOString()}))) });
      state.dirty.players = false;
    }
    if (state.dirty.settings){
      const s = state.settings, rows = ['courses','flights','pin','prizes','resolved'].filter(x=>s[x]!==undefined).map(x=>({key:x,value:s[x],updated_at:new Date().toISOString()}));
      if (rows.length) await api('/gif_settings', {method:'POST', headers:UPSERT, body: JSON.stringify(rows)});
      state.dirty.settings = false;
    }
    for (const r of Object.keys(state.photoDirty)){
      const ph = state.photos[r];
      if (ph && ph.data) await api('/gif_settings', {method:'POST', headers:UPSERT, body: JSON.stringify([{key:'photo_'+r, value:{data:ph.data}, updated_at:ph.t}])});
      else { await api('/gif_settings?key=eq.photo_'+r, {method:'DELETE'}); delete state.photos[r]; }
      delete state.photoDirty[r];
    }
    state.op = null; save();
    const keys = Object.keys(state.outbox);
    if (keys.length){
      const sent = {}; const rows = keys.map(kk=>{ const [player_id,r,h]=kk.split('|'); const v=state.scores[kk]; sent[kk]=v.t;
        return { player_id, round_no:+r, hole:+h, strokes: v.s===null?null:v.s, updated_at:v.t, device: (ui.tab==='admin'&&ui.admin)?DEV.id+'-beheer':DEV.id, device_name: (ui.tab==='admin'&&ui.admin)?'Beheer':(DEV.name||'onbekend') }; });
      await api('/rpc/gif_upsert_scores', {method:'POST', body: JSON.stringify({rows})});
      keys.forEach(kk=>{ if (state.scores[kk] && state.scores[kk].t===sent[kk]) delete state.outbox[kk]; });
      save();
    }
    const [ps, sc, st, phs] = await Promise.all([ api('/gif_players?select=*&order=sort'), api('/gif_scores?select=*'),
      api('/gif_settings?select=*&key=not.like.photo*'), api('/gif_settings?select=key,updated_at&key=like.photo*') ]);
    if (!state.dirty.players && !state.deleted.length) state.players = ps.map(p=>({id:p.id,name:p.name,hcp:Number(p.hcp),sort:p.sort}));
    if (!state.dirty.settings){ const s={}; st.forEach(x=>s[x.key]=x.value); state.settings = s; }
    const server = {};
    sc.forEach(row=>{ const kk=k(row.player_id,row.round_no,row.hole); server[kk]=true; const loc=state.scores[kk];
      if (!loc || new Date(row.updated_at) > new Date(loc.t)){ state.scores[kk] = {s:row.strokes, t:row.updated_at}; delete state.outbox[kk]; } });
    Object.keys(state.scores).forEach(kk=>{ if (!server[kk] && !state.outbox[kk]) delete state.scores[kk]; });
    const seen = {};
    for (const row of phs){ const r=row.key.replace('photo_',''); seen[r]=true;
      if (state.photoDirty[r]) continue;
      if (!state.photos[r] || state.photos[r].t !== row.updated_at){
        const got = await api('/gif_settings?select=value,updated_at&key=eq.'+row.key);
        if (got && got[0]) state.photos[r] = {data:got[0].value.data, t:got[0].updated_at}; } }
    Object.keys(state.photos).forEach(r=>{ if (!seen[r] && !state.photoDirty[r]) delete state.photos[r]; });
    state.lastSync = new Date().toISOString(); syncErr = null; save();
    if (changed) api('/rpc/gif_make_snapshot',{method:'POST',body:JSON.stringify({reason:'auto'})}).catch(()=>{});
    if (manual) toast('Alles gesynchroniseerd');
  }catch(err){
    syncErr = (err.status===404 || /gif_/.test(err.message||'')) ? 'schema' : (navigator.onLine ? 'error' : 'offline');
    if (manual) toast(syncErr==='schema' ? 'Database nog niet ingericht, zie schema.sql' : 'Synchroniseren mislukt, nieuwe poging volgt');
    console.warn(err);
  }finally{
    syncing = false;
    const a = document.activeElement; const typing = a && (a.tagName==='INPUT' || a.tagName==='SELECT');
    if (!typing) render(); else renderSync();
  }
}
function renderSync(){
  const el = $('#sync'), pend = Object.keys(state.outbox).length; let cls='', txt='';
  const live = [1,2,3].some(isLive);
  if (syncing && !state.lastSync) { cls='wait'; txt='Laden'; }
  else if (!navigator.onLine || syncErr==='offline'){ cls='off'; txt = pend ? `Offline, ${pend} wachtend` : 'Offline'; }
  else if (syncErr==='schema'){ cls='off'; txt='Database mist'; }
  else if (pend){ cls='wait'; txt=`${pend} wachtend`; }
  else if (syncErr){ cls='wait'; txt='Opnieuw proberen'; }
  else if (live){ cls='live'; txt='Live'; }
  else { txt='Bijgewerkt'; }
  el.className = 'pill '+cls; el.querySelector('span').textContent = txt;
}
window.addEventListener('online', ()=>{ syncErr=null; sync(); });
window.addEventListener('offline', ()=>{ syncErr='offline'; renderSync(); });
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ sync(); wake(); } });
setInterval(()=>{ if (!document.hidden) sync(); }, 15000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

render(); sync();
</script>
