<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12264A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf in Fife">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Golf in Fife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12264A; --navy2:#1D3765; --gold:#B58B35; --goldlt:#D9C28E;
  --linen:#E8EBE3; --paper:#F7F8F4; --fescue:#56703E; --flag:#A62B2E;
  --ink:#1B2127; --muted:#5E6770; --rule:#C9CEC3;
  --fell:'IM Fell English', Georgia, 'Times New Roman', serif;
  --ui:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Header */
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-family:var(--fell);font-weight:400;font-size:31px;line-height:1;margin:0}
.top .sub{font-size:14px;color:#C3CCDD;margin-top:4px}
.sync{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:5px 11px;color:#fff}
.sync i{width:8px;height:8px;border-radius:50%;background:#7FB069;display:block}
.sync.wait i{background:var(--goldlt)}
.sync.off i{background:#E07A6E}

main{max-width:560px;margin:0 auto;padding:16px 14px 24px}
h2{font-family:var(--fell);font-weight:400;font-size:26px;margin:18px 0 8px;color:var(--navy)}
h2:first-child{margin-top:4px}
h3{font-size:18px;font-weight:600;margin:16px 0 6px;color:var(--navy)}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Segmented controls */
.seg{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:7px 4px;font-weight:500;line-height:1.15;font-size:15px}
.seg button small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.seg button.on{background:var(--navy);color:#fff}
.seg button.on small{color:var(--goldlt)}

/* The leaderboard: manual scoreboard */
.board{background:var(--navy);border:2px solid var(--gold);border-radius:4px;padding:10px 8px 12px;box-shadow:0 2px 0 #0c1a33}
.board-title{font-family:var(--fell);color:#fff;font-size:22px;text-align:center;margin:0 0 2px}
.board-sub{color:var(--goldlt);text-align:center;font-size:13px;margin:0 0 8px}
.board table{width:100%;border-collapse:separate;border-spacing:3px}
.board th{color:var(--goldlt);font-weight:500;font-size:13px;text-align:center;padding:0 2px 2px}
.board th.l{text-align:left;padding-left:8px}
.board td{background:var(--paper);color:var(--navy);text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:7px 2px;border-radius:1px}
.board td.pos{width:34px;background:#dfe4ea}
.board td.name{text-align:left;padding-left:9px;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.board td.name small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.board td.rd{width:40px;font-weight:600;font-size:16px}
.board td.rd.none{color:#9aa3ad;font-weight:400}
.board td.tot{width:52px;background:var(--gold);color:#fff;font-size:20px}
.board tr.lead td.pos{background:var(--gold);color:#fff}
.board .empty{color:#C3CCDD;text-align:center;padding:18px 8px;font-size:15px}

/* Paper cards */
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px;margin:0 0 12px}
.note{border-left:3px solid var(--gold);background:#F3EEDF;padding:8px 10px;border-radius:0 4px 4px 0;font-size:14px;margin:8px 0}
.warn{border-left-color:var(--flag);background:#F6E6E4}

/* Score entry */
.holehead{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:6px}
.holenum{font-family:var(--fell);font-size:54px;line-height:.9;color:var(--navy);min-width:58px;text-align:center}
.holeinfo .nm{font-family:var(--fell);font-style:italic;font-size:19px;color:var(--navy)}
.holeinfo .facts{display:flex;gap:14px;font-size:15px;color:var(--muted)}
.holeinfo .facts b{color:var(--ink);font-weight:600}
.prow{display:grid;grid-template-columns:1fr 50px 52px 50px 46px;align-items:center;gap:6px;padding:10px 0;border-bottom:1px dotted var(--rule)}
.prow:last-of-type{border-bottom:0}
.pname{font-weight:600;font-size:18px;line-height:1.1}
.pname small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.dots{color:var(--gold);font-weight:600}
.pm{height:50px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-size:26px;font-weight:600;color:var(--navy)}
.pm:active{background:#e6eaf1}
.sc{height:52px;border-radius:8px;border:2px solid var(--navy);background:#fff;font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.sc.empty{border-style:dashed;border-color:#9aa3ad;color:#9aa3ad;font-weight:500}
.sc.pu{font-size:15px}
.pts{text-align:center;font-weight:700;font-size:20px;color:var(--navy);line-height:1}
.pts small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.pts.p0{color:var(--flag)} .pts.p3{color:var(--fescue)} .pts.p4{color:var(--gold)}
.pubtn{grid-column:1/-1;justify-self:start;margin-top:-4px;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:2px 0}
.holenav{display:flex;gap:10px;margin-top:12px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:12px 14px;font-weight:600;font-size:17px}
.btn.alt{background:#fff;color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.red{background:#fff;border-color:var(--flag);color:var(--flag)}
.btn.sm{padding:8px 12px;font-size:15px}
.holenav .btn{flex:1;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:12px 0 4px}
.strip button{border:1px solid var(--rule);background:#fff;border-radius:4px;padding:6px 0;font-weight:600;font-size:14px;color:var(--muted)}
.strip button.done{background:var(--fescue);border-color:var(--fescue);color:#fff}
.strip button.part{background:#E6ECDD;color:var(--fescue);border-color:#b9c7a8}
.strip button.cur{outline:2px solid var(--navy);outline-offset:1px;color:var(--navy)}
.strip button.done.cur{color:#fff}
.rtotal{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);padding-top:8px}
.rtotal b{color:var(--navy)}

/* Scorecard table */
.cardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.card{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
table.card th,table.card td{border:1px solid var(--rule);text-align:center;padding:5px 0;min-width:28px}
table.card th{background:var(--navy);color:#fff;font-weight:500}
table.card td.lbl{text-align:left;padding:5px 6px;color:var(--muted);white-space:nowrap;min-width:52px}
table.card tr.g td{font-weight:700;color:var(--navy)}
table.card tr.pt td{color:var(--fescue);font-weight:600}
table.card td.sum{background:#EEF0EA;font-weight:700}
.mk{display:inline-block;min-width:22px;line-height:20px;padding:0 1px}
.mk.b{border:1.5px solid var(--flag);border-radius:50%}
.mk.e{border:1.5px solid var(--flag);border-radius:50%;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--flag)}
.mk.o{border:1.5px solid var(--navy)}
.mk.d{border:1.5px solid var(--navy);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--navy)}

/* Forms */
label.f{display:block;font-size:14px;color:var(--muted);margin:8px 0 3px}
input.t,select.t{width:100%;border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:#fff;font-size:17px}
.plist .pl{display:grid;grid-template-columns:1fr 74px 40px;gap:6px;align-items:center;margin-bottom:6px}
.plist .ch{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-3px 0 6px 2px}
.x{border:1px solid var(--rule);background:#fff;border-radius:6px;height:42px;color:var(--flag);font-size:20px}
.fl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:4px 0}
.fl .seg{margin:0;width:112px}
.cgrid{display:grid;grid-template-columns:34px repeat(3,1fr);gap:4px;align-items:center;font-size:14px}
.cgrid input{width:100%;border:1px solid var(--rule);border-radius:4px;padding:5px 4px;text-align:center;background:#fff;font-size:15px}
.cgrid .h{color:var(--muted);text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Programme */
.day{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:14px 0}
.day h3{margin:0 0 4px;font-family:var(--fell);font-weight:400;font-size:22px}
.day p{font-size:16px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--navy);border-top:2px solid var(--gold);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;color:#AEB9CE;padding:10px 2px 11px;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button.on{color:var(--goldlt)}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>
      <h1>Golf in Fife</h1>
      <div class="sub">Lundin, Elie en Crail, 2–4 oktober</div>
    </div>
    <button class="sync" id="sync" aria-live="polite"><i></i><span>Laden</span></button>
  </div>
</header>

<main id="view"></main>

<nav class="tabs"><div class="tabs-in" id="tabs">
  <button data-tab="board"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stand</button>
  <button data-tab="score"><svg viewBox="0 0 24 24"><path d="M6 21V3l11 4-11 4"/><ellipse cx="12" cy="21" rx="7" ry="1.2"/></svg>Score</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M9 5v14M15 5v14"/></svg>Kaarten</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Programma</button>
  <button data-tab="admin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Beheer</button>
</div></nav>
<div id="toast" role="status"></div>

<script>
/* ============ Config ============ */
const API = 'https://xryjzjhfvqwptgkvlgur.supabase.co/rest/v1';
const KEY = 'sb_publishable_b2BCSdU4dPu6UZxO8cR66Q_-S0jRO_H';
const LS  = 'gif_state_v1';
const DEFAULT_PIN = '1589';

/* Course data, yellow men's tees. Admin can override everything in Beheer. */
const DEFAULT_COURSES = {
  1:{ name:'Lundin Golf Club', short:'Lundin', dayname:'Vrijdag', day:'Vrijdag 2 oktober', date:'2026-10-02', tees:'11.00 en 11.10 uur',
      par:[4,4,4,4,3,4,4,4,5, 4,4,3,5,3,4,4,4,4],
      si: [5,11,14,1,18,9,16,7,3, 10,2,17,8,15,4,13,12,6],
      yds:[403,339,312,415,128,325,266,355,546, 348,447,140,490,170,417,280,330,427],
      names:null, cr:70.2, slope:130, check:'' },
  2:{ name:'The Golf House Club, Elie', short:'Elie', dayname:'Zaterdag', day:'Zaterdag 3 oktober', date:'2026-10-03', tees:'11.00 en 11.10 uur',
      par:[4,4,3,4,4,4,4,4,4, 4,3,4,4,4,4,4,4,4],
      si: [12,3,17,6,13,7,15,1,10, 9,18,2,11,5,16,4,14,8],
      yds:null, names:null, cr:69.3, slope:121,
      check:'Stroke index per hole komt van de witte kaart. Controleer hem tegen de gele scorekaart van de club.' },
  3:{ name:'Crail Golfing Society, Balcomie Links', short:'Crail', dayname:'Zondag', day:'Zondag 4 oktober', date:'2026-10-04', tees:'tijd volgt',
      par:[4,5,3,4,4,3,4,4,4, 4,5,5,3,3,4,3,4,3],
      si: [11,7,15,5,1,13,9,3,17, 8,10,4,6,18,14,16,2,12],
      yds:[313,451,168,315,439,172,273,416,250, 287,427,517,207,141,254,157,417,198],
      names:['Boathouse','Over the Knowe','The Briggs','Fluke Dub',"Hell's Hole",'Wormison','North Carr','Breeches Buoy','Dykeside',
             'Castle Yetts','Lang Whang','The Burn','Craighead','The Cave','Mill Dam','Spion Kop','Road Hole','The Quarry'],
      cr:67.6, slope:118,
      check:'Alleen hole 5 (SI 1) is bevestigd. De overige stroke indexen, rating en slope zijn voorlopig. Neem ze over van de scorekaart op de club.' }
};

/* ============ State ============ */
function blank(){ return {players:[], scores:{}, settings:{}, outbox:{}, dirty:{players:false,settings:false}, deleted:[], op:null, lastSync:null}; }
let state = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); return s ? Object.assign(blank(), s) : blank(); }catch(e){ return blank(); } }
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }

const ui = { tab: sessionStorage.getItem('gif_tab') || 'board', round: defaultRound(), flight:'A', hole:1, boardView:'tot', cardPlayer:null, admin: sessionStorage.getItem('gif_admin')==='1' };
function defaultRound(){
  const d = new Date(); const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if (iso >= '2026-10-04') return 3; if (iso === '2026-10-03') return 2; return 1;
}

/* ============ Golf maths ============ */
const sum = a => a.reduce((x,y)=>x+y,0);
function course(r){ const o = (state.settings.courses||{})[r] || {}; return Object.assign({}, DEFAULT_COURSES[r], o); }
function players(){ return [...state.players].sort((a,b)=>(a.sort||0)-(b.sort||0)); }
function pById(id){ return state.players.find(p=>p.id===id); }
function playingHcp(p, r){
  const c = course(r); const hi = Number(p.hcp)||0;
  return Math.round(hi * c.slope / 113 + (c.cr - sum(c.par)));   // 100% allowance
}
function received(ph, si){
  if (ph >= 0) return Math.floor(ph/18) + (si <= ph % 18 ? 1 : 0);
  const p = -ph; return -(Math.floor(p/18) + (si > 18 - (p % 18) ? 1 : 0));
}
function points(s, par, rc){ if (s===undefined || s===null) return null; if (s===0) return 0; return Math.max(0, 2 + par + rc - s); }
const k = (pid,r,h) => pid+'|'+r+'|'+h;
function getS(pid,r,h){ const v = state.scores[k(pid,r,h)]; return v ? v.s : undefined; }
function holeInfo(p, r, h){
  const c = course(r), ph = playingHcp(p,r), rc = received(ph, c.si[h-1]), s = getS(p.id,r,h);
  return { par:c.par[h-1], si:c.si[h-1], rc, s, pts: points(s, c.par[h-1], rc) };
}
function roundStats(p, r){
  let pts=0, thru=0, gross=0, pu=false; const per=[];
  for (let h=1; h<=18; h++){ const i = holeInfo(p,r,h); per.push(i.pts);
    if (i.s!==undefined && i.s!==null){ thru++; pts+=i.pts; if (i.s>0) gross+=i.s; else pu=true; } }
  return { pts, thru, gross, pu, per };
}
function lastPlayedRound(){ for (let r=3;r>=1;r--) if (state.players.some(p=>roundStats(p,r).thru>0)) return r; return 1; }
function countback(per){ const s=(a,b)=>sum(per.slice(a,b).map(x=>x||0)); return [s(9,18), s(12,18), s(15,18), s(17,18)]; }
function ranking(view){
  const lr = view==='tot' ? lastPlayedRound() : Number(view);
  const rows = players().map(p=>{
    const rs = [1,2,3].map(r=>roundStats(p,r));
    const main = view==='tot' ? sum(rs.map(x=>x.pts)) : rs[lr-1].pts;
    return { p, rs, main, tb:[ ...(view==='tot'?[rs[lr-1].pts]:[]), ...countback(rs[lr-1].per) ] };
  });
  rows.sort((a,b)=>{ if (b.main!==a.main) return b.main-a.main; for (let i=0;i<a.tb.length;i++) if (b.tb[i]!==a.tb[i]) return b.tb[i]-a.tb[i]; return 0; });
  rows.forEach((r,i)=>{ const prev=rows[i-1]; r.pos = (prev && prev.main===r.main && prev.tb.join()===r.tb.join()) ? prev.pos : i+1; });
  return rows;
}
function flights(r){
  const f = ((state.settings.flights||{})[r]) || {}; const ps = players(); const A=[], B=[];
  ps.forEach((p,i)=>{ const g = f[p.id] || (i<Math.ceil(ps.length/2)?'A':'B'); (g==='A'?A:B).push(p); });
  return {A,B};
}

/* ============ Rendering ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'), 2400); }

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  const v = $('#view');
  if (ui.tab==='board') v.innerHTML = viewBoard();
  else if (ui.tab==='score') v.innerHTML = viewScore();
  else if (ui.tab==='cards') v.innerHTML = viewCards();
  else if (ui.tab==='prog') v.innerHTML = viewProg();
  else v.innerHTML = ui.admin ? viewAdmin() : viewPin();
  renderSync();
}
function roundSeg(cur, act){
  return `<div class="seg">${[1,2,3].map(r=>{const c=course(r);return `<button class="${cur===r?'on':''}" data-act="${act}" data-v="${r}">${c.dayname}<small>${esc(c.short)}</small></button>`}).join('')}</div>`;
}

function viewBoard(){
  const opts = [['tot','Totaal'],['1','Vrijdag'],['2','Zaterdag'],['3','Zondag']];
  let h = `<div class="seg">${opts.map(([v,l])=>`<button class="${ui.boardView===v?'on':''}" data-act="bview" data-v="${v}">${l}</button>`).join('')}</div>`;
  const rows = ranking(ui.boardView);
  const anyScore = rows.some(r=>r.rs.some(x=>x.thru>0));
  if (ui.boardView==='tot'){
    h += `<div class="board"><p class="board-title">Golf in Fife</p><p class="board-sub">Stableford, 54 holes, volledige handicap</p>`;
    if (!rows.length) h += `<div class="empty">Voeg de spelers toe onder Beheer.</div>`;
    else {
      h += `<table><thead><tr><th></th><th class="l">Speler</th><th>Vr</th><th>Za</th><th>Zo</th><th>Tot</th></tr></thead><tbody>`;
      rows.forEach(r=>{
        h += `<tr class="${r.pos===1&&anyScore?'lead':''}"><td class="pos">${anyScore?r.pos:''}</td><td class="name">${esc(r.p.name)}<small>hcp ${fmtHcp(r.p.hcp)}</small></td>`;
        r.rs.forEach(x=>{ h += x.thru ? `<td class="rd">${x.pts}${x.thru<18?`<sup style="font-size:10px;color:#8a93a0">${x.thru}</sup>`:''}</td>` : `<td class="rd none">–</td>`; });
        h += `<td class="tot">${anyScore?r.main:'–'}</td></tr>`;
      });
      h += `</tbody></table>`;
    }
    h += `</div><p class="small muted" style="margin-top:8px">Een klein cijfertje naast een score betekent dat de ronde nog loopt (aantal gespeelde holes). Bij gelijke stand beslist de laatste ronde, daarna de laatste 9, 6, 3 en 1 hole.</p>`;
  } else {
    const r = Number(ui.boardView), c = course(r);
    h += `<div class="board"><p class="board-title">${esc(c.short)}</p><p class="board-sub">${c.day}, par ${sum(c.par)}</p>`;

    else {
      const any = rows.some(x=>x.rs[r-1].thru>0);
      h += `<table><thead><tr><th></th><th class="l">Speler</th><th>PH</th><th>Holes</th><th>Pnt</th></tr></thead><tbody>`;
      rows.forEach(x=>{ const s=x.rs[r-1];
        h += `<tr class="${x.pos===1&&any?'lead':''}"><td class="pos">${any?x.pos:''}</td><td class="name">${esc(x.p.name)}</td><td class="rd">${playingHcp(x.p,r)}</td><td class="rd">${s.thru===18?'F':s.thru||'–'}</td><td class="tot">${s.thru?s.pts:'–'}</td></tr>`; });
      h += `</tbody></table>`;
    }
    h += `</div>`;
    if (rows.length && rows.some(x=>x.rs[r-1].thru===18) && rows.every(x=>x.rs[r-1].thru===18))
      h += `<div class="note">Dagwinnaar ${c.dayname.toLowerCase()}: <b>${esc(rows[0].p.name)}</b> met ${rows[0].main} punten.</div>`;
  }
  return h;
}
function fmtHcp(v){ v=Number(v)||0; return v<0 ? '+'+Math.abs(v).toFixed(1) : v.toFixed(1); }

function first(n){ return String(n||'').split(' ')[0]; }

function viewCards(){
  const ps = players();
  if (!ps.length) return `<div class="paper"><p>Er zijn nog geen spelers. Voeg ze toe onder Beheer.</p></div>`;

  [1,2,3].forEach(r=>{
    const c = course(r), rs = roundStats(p,r), ph = playingHcp(p,r);
    h += `<h2>${c.dayname}, ${esc(c.short)}</h2><p class="small muted">Playing handicap ${ph}, par ${sum(c.par)}. ${rs.thru?`${rs.pts} punten${rs.gross&&!rs.pu&&rs.thru===18?`, ${rs.gross} bruto`:''}.`:'Nog niet gespeeld.'}</p>`;
    [[1,9,'Uit'],[10,18,'In']].forEach(([a,b,lbl])=>{
      let hh=`<th></th>`, par=`<td class="lbl">Par</td>`, si=`<td class="lbl">Index</td>`, g=`<td class="lbl">Score</td>`, pt=`<td class="lbl">Punten</td>`;
      let sp=0, sg=0, spt=0, gOk=true;
      for (let n=a;n<=b;n++){ const i=holeInfo(p,r,n); hh+=`<th>${n}</th>`; par+=`<td>${i.par}</td>`; si+=`<td>${i.si}${i.rc>0?`<sup style="color:var(--gold)">${'•'.repeat(Math.min(i.rc,2))}</sup>`:''}</td>`;
        sp+=i.par; g+=`<td>${mark(i.s,i.par)}</td>`; pt+=`<td>${i.pts===null?'':i.pts}</td>`;
        if (i.s>0) sg+=i.s; else gOk=false; spt+=i.pts||0; }
      hh+=`<th>${lbl}</th>`; par+=`<td class="sum">${sp}</td>`; si+=`<td class="sum"></td>`; g+=`<td class="sum">${gOk?sg:''}</td>`; pt+=`<td class="sum">${spt}</td>`;
      h += `<div class="cardwrap"><table class="card"><thead><tr>${hh}</tr></thead><tbody><tr>${par}</tr><tr>${si}</tr><tr class="g">${g}</tr><tr class="pt">${pt}</tr></tbody></table></div><div style="height:6px"></div>`;
    });

function mark(s, par){
  if (s===undefined||s===null) return ''; if (s===0) return '–';
  const d = s-par, c = d<=-2?'e':d===-1?'b':d===1?'o':d>=2?'d':'';
  return `<span class="mk ${c}">${s}</span>`;
}

/* ============ Actions ============ */
function setScore(pid, val){
  const kk = k(pid, ui.round, ui.hole);
  state.scores[kk] = { s: val, t: new Date().toISOString() };
  state.outbox[kk] = true; save(); render(); schedulePush();
}
function markDirty(what){ state.dirty[what] = true; save(); schedulePush(); }
function setCourse(r, patch){
  const cs = state.settings.courses = state.settings.courses || {};
  const cur = course(r);
  cs[r] = Object.assign({}, cs[r]||{}, { par:[...cur.par], si:[...cur.si], yds: cur.yds?[...cur.yds]:null, cr:cur.cr, slope:cur.slope }, patch);
  markDirty('settings');
}

document.addEventListener('click', async e=>{
  const tab = e.target.closest('[data-tab]');
  if (tab){ ui.tab = tab.dataset.tab; sessionStorage.setItem('gif_tab', ui.tab); render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#sync')){ sync(true); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, pid = b.dataset.p;
  const par = course(ui.round).par[ui.hole-1];
  switch(a){
    case 'bview': ui.boardView = v; render(); break;
    case 'round': ui.round = Number(v); ui.hole = firstOpenHole(); render(); break;
    case 'flight': ui.flight = v; ui.hole = firstOpenHole(); render(); break;
    case 'hole': ui.hole = Number(v); render(); break;
    case 'setpar': { const s=getS(pid,ui.round,ui.hole); if (s===undefined||s===null) setScore(pid, par); break; }
    case 'inc': { const s=getS(pid,ui.round,ui.hole); setScore(pid, (s===undefined||s===null||s===0) ? par : Math.min(15, s+1)); break; }
    case 'dec': { const s=getS(pid,ui.round,ui.hole); setScore(pid, (s===undefined||s===null||s===0) ? par-1 : Math.max(1, s-1)); break; }
    case 'pickup': { const s=getS(pid,ui.round,ui.hole); setScore(pid, s===0 ? null : 0); break; }
    case 'unlock': { const pin = $('#pin').value.trim(); if (pin === String(state.settings.pin||DEFAULT_PIN)){ ui.admin=true; sessionStorage.setItem('gif_admin','1'); render(); } else toast('Onjuiste pincode'); break; }
    case 'lock': ui.admin=false; sessionStorage.removeItem('gif_admin'); render(); break;
    case 'padd': { const ps=players(); state.players.push({ id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:'Speler '+(ps.length+1), hcp:18, sort:(ps.length?Math.max(...ps.map(p=>p.sort||0))+1:0) }); markDirty('players'); render(); break; }
    case 'pdel': { const p=pById(pid); if (!p || !confirm(`${p.name} en al zijn scores verwijderen?`)) break;
      state.players = state.players.filter(x=>x.id!==pid); state.deleted.push(pid);
      Object.keys(state.scores).forEach(kk=>{ if (kk.startsWith(pid+'|')){ delete state.scores[kk]; delete state.outbox[kk]; } });
      markDirty('players'); render(); break; }
    case 'fset': { const fl = state.settings.flights = state.settings.flights || {}; fl[b.dataset.r] = fl[b.dataset.r] || {};
      const cur = flights(Number(b.dataset.r)); players().forEach(p=>{ if (!fl[b.dataset.r][p.id]) fl[b.dataset.r][p.id] = cur.A.includes(p)?'A':'B'; });
      fl[b.dataset.r][pid] = v; markDirty('settings'); render(); break; }
    case 'cconfirm': { const r=Number(b.dataset.r); setCourse(r, { check: course(r).check ? '' : (DEFAULT_COURSES[r].check||'Controleer de kaart.') }); render(); break; }
    case 'creset': { const r=Number(b.dataset.r); if (!confirm('Baangegevens terugzetten naar de standaardwaarden?')) break; const cs=state.settings.courses||{}; delete cs[r]; state.settings.courses=cs; markDirty('settings'); render(); break; }
    case 'backup': downloadBackup(); break;
    case 'restore': $('#restorefile').click(); break;
    case 'syncnow': sync(true); break;
    case 'resetscores': if (confirm('Alle scores van alle rondes wissen? Dit kan niet ongedaan worden, maak eerst een back-up.')){ state.scores={}; state.outbox={}; state.op='resetscores'; save(); render(); sync(true); } break;
    case 'setpin': { const np=$('#newpin').value.trim(); if (np.length<4){ toast('Kies minimaal 4 cijfers'); break; } state.settings.pin=np; markDirty('settings'); toast('Pincode opgeslagen'); render(); break; }
  }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='restorefile'){ const f=el.files[0]; if (f) restoreFrom(f); el.value=''; return; }
  const c = el.dataset.chg; if (!c) return;
  const p = el.dataset.p ? pById(el.dataset.p) : null, r = Number(el.dataset.r), h = Number(el.dataset.h);
  const num = x => Number(String(x).replace(',', '.').replace('+','-'));
  switch(c){
    case 'cardp': ui.cardPlayer = el.value; render(); break;
    case 'pname': if (p){ p.name = el.value.trim() || p.name; markDirty('players'); render(); } break;
    case 'phcp': if (p){ const n = num(el.value.trim()); if (isNaN(n) || n>54 || n<-10){ toast('Ongeldige handicap'); render(); break; } p.hcp = Math.round(n*10)/10; markDirty('players'); render(); } break;
    case 'ccr': { const n=num(el.value); if (!isNaN(n)) setCourse(r,{cr:n}); render(); break; }
    case 'cslope': { const n=parseInt(el.value,10); if (n>=55&&n<=155) setCourse(r,{slope:n}); else toast('Slope ligt tussen 55 en 155'); render(); break; }
    case 'cpar': case 'csi': case 'cyds': {
      const cur = course(r), n = parseInt(el.value,10);
      if (c==='cpar'){ if (n<3||n>6){ toast('Par moet 3 tot 6 zijn'); render(); break; } const a=[...cur.par]; a[h-1]=n; setCourse(r,{par:a}); }
      if (c==='csi'){ if (!(n>=1&&n<=18)){ toast('Index moet 1 tot 18 zijn'); render(); break; } const a=[...cur.si]; a[h-1]=n; setCourse(r,{si:a}); }
      if (c==='cyds'){ const a = cur.yds?[...cur.yds]:Array(18).fill(null); a[h-1]= isNaN(n)?null:n; setCourse(r,{yds:a}); }
      render(); break; }
  }
});
function firstOpenHole(){
  const grp = flights(ui.round)[ui.flight];
  for (let n=1;n<=18;n++) if (grp.some(p=>{const s=getS(p.id,ui.round,n);return s===undefined||s===null})) return n;
  return 18;
}

/* ============ Backup / restore ============ */
function downloadBackup(){
  const data = { app:'golf-in-fife', version:1, exported_at:new Date().toISOString(),
    players: players(), settings: state.settings,
    scores: Object.entries(state.scores).map(([kk,v])=>{ const [player_id,round_no,hole]=kk.split('|'); return { player_id, round_no:+round_no, hole:+hole, strokes:v.s, updated_at:v.t }; }) };
  const blob = new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'golf-in-fife-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Back-up gedownload');
}
async function restoreFrom(file){
  try{
    const d = JSON.parse(await file.text());
    if (d.app!=='golf-in-fife' || !Array.isArray(d.players)) throw new Error('Dit is geen Golf in Fife back-up.');
    if (!confirm(`Back-up van ${new Date(d.exported_at).toLocaleString('nl-NL')} terugzetten? Alle huidige gegevens worden vervangen.`)) return;
    const now = new Date().toISOString();
    state.players = d.players; state.settings = d.settings || {}; state.scores = {}; state.outbox = {};
    (d.scores||[]).forEach(s=>{ const kk=k(s.player_id,s.round_no,s.hole); state.scores[kk]={ s:s.strokes, t:now }; state.outbox[kk]=true; });
    state.dirty = {players:true, settings:true}; state.deleted = []; state.op = 'replace';
    save(); render(); toast('Back-up teruggezet'); sync(true);
  }catch(err){ toast(err.message || 'Back-up kon niet worden gelezen'); }
}

/* ============ Sync (offline first) ============ */
let syncing = false, syncErr = null, pushTimer = null;
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(()=>sync(), 600); }
async function api(path, opts={}){
  const res = await fetch(API+path, { ...opts, headers:{ apikey:KEY, 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if (!res.ok){ const t = await res.text(); const err = new Error(t || res.statusText); err.status = res.status; throw err; }
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
async function sync(manual){
  if (syncing) return; if (!navigator.onLine){ syncErr='offline'; renderSync(); if (manual) toast('Geen verbinding, scores blijven bewaard'); return; }
  syncing = true; renderSync();
  try{
    // 1. Whole-database operations (restore / reset)
    if (state.op==='replace'){ await api('/gif_players?id=neq.__none__', {method:'DELETE'}); state.deleted=[]; }
    if (state.op==='resetscores'){ await api('/gif_scores?round_no=gte.1', {method:'DELETE'}); }
    // 2. Players
    if (state.deleted.length){ await api('/gif_players?id=in.('+state.deleted.map(encodeURIComponent).join(',')+')', {method:'DELETE'}); state.deleted=[]; }
    if (state.dirty.players){
      if (state.players.length) await api('/gif_players', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify(state.players.map(p=>({id:p.id,name:p.name,hcp:p.hcp,sort:p.sort||0,updated_at:new Date().toISOString()}))) });
      state.dirty.players = false;
    }
    // 3. Settings
    if (state.dirty.settings){
      const s = state.settings, rows = ['courses','flights','pin'].filter(x=>s[x]!==undefined).map(x=>({key:x,value:s[x],updated_at:new Date().toISOString()}));
      if (rows.length) await api('/gif_settings', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify(rows)});
      state.dirty.settings = false;
    }
    state.op = null; save();
    // 4. Scores (last write wins per hole, enforced in the database)
    const keys = Object.keys(state.outbox);
    if (keys.length){
      const sent = {}; const rows = keys.map(kk=>{ const [player_id,r,h]=kk.split('|'); const v=state.scores[kk]; sent[kk]=v.t;
        return { player_id, round_no:+r, hole:+h, strokes: v.s===null?null:v.s, updated_at:v.t }; });
      await api('/rpc/gif_upsert_scores', {method:'POST', body: JSON.stringify({rows})});
      keys.forEach(kk=>{ if (state.scores[kk] && state.scores[kk].t===sent[kk]) delete state.outbox[kk]; });
      save();
    }
    // 5. Pull
    const [ps, sc, st] = await Promise.all([ api('/gif_players?select=*&order=sort'), api('/gif_scores?select=*'), api('/gif_settings?select=*') ]);
    if (!state.dirty.players && !state.deleted.length) state.players = ps.map(p=>({id:p.id,name:p.name,hcp:Number(p.hcp),sort:p.sort}));
    if (!state.dirty.settings){ const s={}; st.forEach(x=>s[x.key]=x.value); state.settings = s; }
    const server = {};
    sc.forEach(row=>{ const kk=k(row.player_id,row.round_no,row.hole); server[kk]=true; const loc=state.scores[kk];
      if (!loc || new Date(row.updated_at) > new Date(loc.t)){ state.scores[kk] = {s:row.strokes, t:row.updated_at}; delete state.outbox[kk]; } });
    Object.keys(state.scores).forEach(kk=>{ if (!server[kk] && !state.outbox[kk]) delete state.scores[kk]; });
    state.lastSync = new Date().toISOString(); syncErr = null; save();
    if (manual) toast('Alles gesynchroniseerd');
  }catch(err){
    syncErr = (err.status===404 || /gif_/.test(err.message||'')) ? 'schema' : (navigator.onLine ? 'error' : 'offline');
    if (manual) toast(syncErr==='schema' ? 'Database nog niet ingericht, zie schema.sql' : 'Synchroniseren mislukt, nieuwe poging volgt');
    console.warn(err);
  }finally{
    syncing = false;
    const a = document.activeElement; const typing = a && (a.tagName==='INPUT' || a.tagName==='SELECT');
    if (!typing) render(); else renderSync();
  }
}
function renderSync(){
  const el = $('#sync'), pend = Object.keys(state.outbox).length; let cls='', txt='';
  if (syncing) { cls='wait'; txt='Bezig'; }
  else if (!navigator.onLine || syncErr==='offline'){ cls='off'; txt = pend ? `Offline, ${pend} wachtend` : 'Offline'; }
  else if (syncErr==='schema'){ cls='off'; txt='Database mist'; }
  else if (syncErr){ cls='wait'; txt = pend ? `${pend} wachtend` : 'Opnieuw proberen'; }
  else if (pend){ cls='wait'; txt=`${pend} wachtend`; }
  else { txt='Bijgewerkt'; }
  el.className = 'sync '+cls; el.querySelector('span').textContent = txt;
}
window.addEventListener('online', ()=>{ syncErr=null; sync(); });
window.addEventListener('offline', ()=>{ syncErr='offline'; renderSync(); });
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) sync(); });
setInterval(()=>{ if (!document.hidden) sync(); }, 20000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

render(); sync();
</script>
